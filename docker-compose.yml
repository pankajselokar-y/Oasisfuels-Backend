# Local PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: pump-rewards-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pump
      POSTGRES_PASSWORD: pump_dev_password
      POSTGRES_DB: pump_rewards
    ports:
      - '5432:5432'
    volumes:
      - pump_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pump -d pump_rewards']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pump_pgdata:
